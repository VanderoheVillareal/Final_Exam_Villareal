---
- name: Configure Ubuntu and CentOS Servers
  hosts: all
  become: true
  vars_files:
    - config.yaml

  tasks:
    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install Apache on Ubuntu
      ansible.builtin.apt:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Apache on CentOS
      ansible.builtin.dnf:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start and enable Apache on Ubuntu
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    - name: Start and enable Apache on CentOS
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring.version }}/node_exporter-{{ monitoring.version }}.linux-{{ monitoring.architecture }}.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: true
        creates: "/tmp/node_exporter-{{ monitoring.version }}.linux-{{ monitoring.architecture }}/node_exporter"

    - name: Install Node Exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ monitoring.version }}.linux-{{ monitoring.architecture }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Create Node Exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ monitoring.port }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true

    - name: Configure MOTD
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Ansible Managed by {{ ansible_user_name }}\n"
        owner: root
        group: root
        mode: "0644"
